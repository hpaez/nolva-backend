version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Tooling moves together; runtime dependencies (hono) get their own PRs.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
