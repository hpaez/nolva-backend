name: Deploy

on:
  push:
    branches: [main]
  # Redeploy main by hand (still behind the approval gate).
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order; never cancel a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `production` environment requires a reviewer's approval (Settings →
    # Environments), so this job waits until it is approved in Actions. Its
    # secrets are only available once approved.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Before the new code goes live: migrations must stay compatible with
      # the version currently deployed (add columns/tables; drop them in a
      # later release).
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy the Worker
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.deploy.outputs.url != ''
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "${{ steps.deploy.outputs.url }}/v1/health"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::/v1/health did not answer 200 after deploying"
          exit 1
