name: CI

on:
  pull_request:
  # Reused by the deploy workflow, so main is checked before every deploy.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # Required status check for branch protection on main.
    name: CI result
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # Also generates worker-configuration.d.ts (postinstall: wrangler types).
      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

      - name: Bundle the Worker
        run: npx wrangler deploy --dry-run --outdir dist
